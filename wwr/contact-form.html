<form>
    <div>
        <label for="fullname">Name:</label>
        <input type="text" id="fullname" name="fullname" required>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="usermail" name="usermail" required>
    </div>
    <div>
        <p>Message Purpose</p>
        <div>
            <label>
            <input type="radio" name="purpose" value="general">General Inquiry
            </label>
        </div>
        <div>
            <label>
            <input type="radio" name="purpose" value="question">Reservation Question
            </label>
        </div>
        <div>
            <label>
                <input type="radio" name="purpose" value="suggestion">Website Suggestion
            </label>
        </div>
    </div>
    <div>
        <label type="feedback">Message</label>
        <textarea id="feedback" name="feedback" rows="4" placeholder="Type Here"></textarea>
    </div>
    <div>
        <label for="subscribe">Please Subscribe me to monthly newsletter</label>
        <input type="checkbox" id="subscribe" name="subscribe">
    </div>
    <button type="submit">Get in Touch!</button>
</form>
