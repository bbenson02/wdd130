<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description" content="Contact information for the White Water Rafting Company">
    <meta name="author" content="Brelyn Benson">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page-layout">
    <header class="header">
        <img src="images/wwr-logo.png" alt="White Water Rafting logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="contact-page-layout">White Water Rafting</h1>
        
        <h2>Contact Us</h2>
        <section class="contact-page-layout">
            <p>246 River Road</p>
            <p>No Name, Colorado</p>
            <p>Phone: +1 234-567-8910</p>
            <p>Email: <a href="mailto">whitewaterrafting@example.com</a></p>
        </section>
        <div class="map-form-layout">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d10961.847019771307!2d-107.3078455197408!3d39.55815640249178!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1790958882593!5m2!1sen!2sus" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            
            <div class="form-container">
            <form>
                <fieldset>
                <div>
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="usermail" name="usermail" required>
                </div>
            
                <div class="purpose">
                    <div class="purpose-label">Message <br/>Purpose</div>
                    <div class="purpose-options">
                        <label><input type="radio" name="purpose" value="general">General Inquiry</label>
                        <label><input type="radio" name="purpose" value="question">Reservation Question</label>
                        <label><input type="radio" name="purpose" value="suggestion">Website Suggestion</label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="feedback">Message</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Type Here"></textarea>
                </div>

                <div>
                    <label for="subscribe"><input type="checkbox" id="subscribe" name="subscribe">Please Subscribe me to monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
                </fieldset>
            </form>
            </div>

        </div>
            <h2>Meet Our Team</h2>
        <section class="section-staff">
    
            <div class="contact-page-layout section-staff">
            <figure>
            <img src="images/office-manager.jpg" alt="Woman sitting on a yellow raft, smiling.">
                <figcaption>Office Manager</figcaption>
            </figure>
            <figure>
            <img src="images/operations-manager.jpg" alt="A man in an orange life vest, smiling, with oars behind him.">
                <figcaption>Operations Manager</figcaption>
            </figure>
            <figure>
            <img src="images/rafter-guide.jpg" alt="A woman in an orange life vest standing triumphantly, holding up an oar.">
                <figcaption>Rafter/River Guide</figcaption>
            </figure>
            <figure>
            <img src="images/saftey-boater.jpg" alt="A young man wearing an orange life vest and orange saftey helmet, smiling with a thumbs up.">
                <figcaption>Saftey Boater</figcaption>
            </figure>
            <figure>
            <img src="images/media-specialist.jpg" alt="A man in a kayak wearing a camera on his forhead, smiling and holding a paddle.">
                <figcaption>Media Specialist</figcaption>
            </figure>
        </div>
        </section>
    <footer class="footer">
        <p>&copy;2026 🌊 White Water Rafting 🌊 Brelyn Benson</p>
            <!-- nav footer was class="socialmedia", I added it to footer, not sure if that actually helped me at all -->
            <nav class="socialmedia">
                <a href="https://instagram.com">
                    <img src="images/instagram-icon.png" alt="Instagram Logo" width="50">
                </a>
                <a href="https://facebook.com">
                    <img src="images/facebook-icon.png" alt="Facebook Logo" width="50">
                </a>
                <a href="https://youtube.com">
                    <img src="images/youtube-icon.png" alt="Youtube Logo" width="50">
                </a>
            </nav>
    </footer>
</body>
</html>
